<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Bus Tracker MVP</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
    }
    .box {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>🚌 公車追蹤 MVP</h2>

<input id="routeInput" placeholder="輸入路線（307 / 262 / 紅33）" />
<button onclick="start()">開始追蹤</button>

<div class="box">
  <div>Token：</div>
  <div id="tokenStatus">尚未取得</div>
</div>

<div class="box">
  <div>最近公車：</div>
  <div id="busInfo">-</div>
</div>

<div class="box">
  <div>距離：</div>
  <div id="distance">-</div>
</div>

<script>
const CLIENT_ID = "YOUR_CLIENT_ID";
const CLIENT_SECRET = "YOUR_CLIENT_SECRET";

let token = null;
let tokenExpireAt = 0;
let timer = null;

// ----------------------
// 取得 token
// ----------------------
async function fetchToken() {
  const res = await fetch(
    "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        grant_type: "client_credentials",
        client_id: CLIENT_ID,
        client_secret: CLIENT_SECRET
      })
    }
  );

  const data = await res.json();

  token = data.access_token;
  tokenExpireAt = Date.now() + (data.expires_in - 60) * 1000;

  document.getElementById("tokenStatus").innerText = "OK";
}

// ----------------------
// token cache
// ----------------------
async function getToken() {
  const now = Date.now();

  if (!token || now >= tokenExpireAt) {
    await fetchToken();
  }

  return token;
}

// ----------------------
// distance
// ----------------------
function dist(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2)**2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ----------------------
// 取得公車
// ----------------------
async function fetchBuses(route) {
  const t = await getToken();

  const res = await fetch(
    "https://tdx.transportdata.tw/api/basic/v2/Bus/RealTimeByFrequency/City/Taipei?$format=JSON",
    {
      headers: {
        Authorization: "Bearer " + t
      }
    }
  );

  const data = await res.json();

  return data.filter(x =>
    x.RouteName?.Zh_tw === route
  );
}

// ----------------------
// 找最近車
// ----------------------
function findNearest(buses) {
  let best = null;
  let min = Infinity;

  buses.forEach(b => {
    if (!b.BusPosition) return;

    const d = dist(
      25.0330, 121.5654, // 先用台北預設位置（可再升級 GPS）
      b.BusPosition.PositionLat,
      b.BusPosition.PositionLon
    );

    if (d < min) {
      min = d;
      best = b;
    }
  });

  return { best, min };
}

// ----------------------
// 更新畫面
// ----------------------
async function update(route) {
  const buses = await fetchBuses(route);

  const { best, min } = findNearest(buses);

  document.getElementById("busInfo").innerText =
    best?.PlateNumb || "無資料";

  document.getElementById("distance").innerText =
    min.toFixed(2) + " km";
}

// ----------------------
// start
// ----------------------
async function start() {
  const route = document.getElementById("routeInput").value;

  if (!route) return alert("請輸入路線");

  await getToken();
  await update(route);

  if (timer) clearInterval(timer);

  timer = setInterval(() => update(route), 10000);
}
</script>

</body>
</html>
